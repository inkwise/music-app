# Music Service 配置文件
# 修改后重启服务即可生效

[server]
# HTTP 监听端口
port = 8080

[database]
# 数据库类型: "sqlite" 或 "mysql"
db_type = "sqlite"
# SQLite 模式
path = "./data/music.db"
# MySQL 模式 (仅 db_type = "mysql" 时生效)
host = "127.0.0.1"
port = 3306
user = "root"
password = ""
name = "music_service"

[storage]
# 存储类型: "oss" 或 "local"
storage_type = "oss"
# 本地存储模式 (仅 storage_type = "local" 时生效)
local_path = "./uploads"

[storage.oss]
# 阿里云 OSS 配置 (仅 storage_type = "oss" 时生效)
endpoint = "oss-cn-hangzhou.aliyuncs.com"
access_key_id = ""
access_key_secret = ""
bucket_name = "your-bucket-name"

[jwt]
# JWT 签名密钥 (请务必修改为随机字符串)
secret = "my-super-secret-key-12345"

[fingerprint]
# fpcalc 最大并发数
max_workers = 2
# 指纹匹配最低相似度 (0-1)
min_similarity = 0.85
# 时长容差 (秒)
duration_tolerance = 10.0

[share]
# 分享链接有效期 (小时)
expiry_hours = 4
